name: Build Mac app

# Every push to main builds the app. Publishing a GitHub Release (e.g. tag
# v1.0.0) builds it with that version number and attaches the DMG to the release.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" MacApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" MacApp/Info.plist

      - name: Build
        run: |
          set -o pipefail
          swift --version
          UNIVERSAL=1 MacApp/build-app.sh --no-install 2>&1 | tee build.log
          lipo -info "MacApp/build/Morse Eye.app/Contents/MacOS/MorseEye"

      - name: Self-test
        run: |
          python3 MacApp/scripts/mock_ai_server.py &
          sleep 2
          set -o pipefail
          perl -e 'alarm 120; exec @ARGV' "MacApp/build/Morse Eye.app/Contents/MacOS/MorseEye" --self-test 2>&1 | tee selftest.log

      - name: Report problems
        if: failure()
        run: |
          # Surface errors as annotations so they're readable without downloading logs
          {
            if [ -f build.log ]; then
              grep -E "error:" build.log | sed 's#.*/Sources/##' | sort -u | head -80
              echo "---- build: last lines ----"; tail -25 build.log
            fi
            if [ -f selftest.log ]; then
              echo "---- self-test ----"; tail -60 selftest.log
              echo "---- crash report ----"; python3 MacApp/scripts/crash_summary.py
            fi
          } > summary.txt 2>&1 || true
          msg=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build output::$msg"

      - name: Make DMG
        run: MacApp/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MorseEye-dmg
          path: MacApp/build/MorseEye.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          DMG="MorseEye-${TAG}.dmg"
          cp MacApp/build/MorseEye.dmg "$DMG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --notes-file MacApp/RELEASE_NOTES.md
          else
            gh release create "$TAG" "$DMG" --title "Morse Eye ${TAG}" --notes-file MacApp/RELEASE_NOTES.md
          fi
